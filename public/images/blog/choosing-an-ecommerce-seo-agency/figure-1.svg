<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-label="Eight questions in four groups"><rect width="800" height="460" fill="#F6F2EA"/><text x="40" y="58" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B1A17">Eight questions in four groups</text><rect x="40" y="76" width="56" height="4" fill="#C22A1D"/><rect x="40.0" y="112" width="166.5" height="300" rx="12" fill="#FFFFFF" stroke="#D9D2C3" stroke-width="1.5"/><text x="56.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C22A1D">PEOPLE</text><text x="56.0" y="186" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1B1A17" text-anchor="start">who does</text><text x="56.0" y="214" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1B1A17" text-anchor="start">the work?</text><rect x="224.5" y="112" width="166.5" height="300" rx="12" fill="#FFFFFF" stroke="#D9D2C3" stroke-width="1.5"/><text x="240.5" y="146" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C22A1D">PROCESS</text><text x="240.5" y="186" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1B1A17" text-anchor="start">what will</text><text x="240.5" y="214" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1B1A17" text-anchor="start">you check</text><text x="240.5" y="242" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1B1A17" text-anchor="start">first?</text><rect x="409.0" y="112" width="166.5" height="300" rx="12" fill="#FFFFFF" stroke="#D9D2C3" stroke-width="1.5"/><text x="425.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C22A1D">REPORTING</text><text x="425.0" y="186" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1B1A17" text-anchor="start">how will</text><text x="425.0" y="214" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1B1A17" text-anchor="start">you report?</text><rect x="593.5" y="112" width="166.5" height="300" rx="12" fill="#FFFFFF" stroke="#D9D2C3" stroke-width="1.5"/><text x="609.5" y="146" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C22A1D">EXIT</text><text x="609.5" y="186" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1B1A17" text-anchor="start">what do we</text><text x="609.5" y="214" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1B1A17" text-anchor="start">keep?</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-label="Eight areas an ecommerce audit covers"><rect width="800" height="460" fill="#F6F2EA"/><text x="40" y="58" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B1A17">Eight areas an ecommerce audit covers</text><rect x="40" y="76" width="56" height="4" fill="#C22A1D"/><text x="40" y="132.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#C22A1D">01</text><text x="110" y="133.0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1B1A17" text-anchor="start">Crawling and indexing</text><line x1="40" y1="148.0" x2="760" y2="148.0" stroke="#D9D2C3" stroke-width="1"/><text x="40" y="176.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#C22A1D">02</text><text x="110" y="177.0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1B1A17" text-anchor="start">Speed and mobile experience</text><line x1="40" y1="192.0" x2="760" y2="192.0" stroke="#D9D2C3" stroke-width="1"/><text x="40" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#C22A1D">03</text><text x="110" y="221.0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1B1A17" text-anchor="start">On-page structure</text><line x1="40" y1="236.0" x2="760" y2="236.0" stroke="#D9D2C3" stroke-width="1"/><text x="40" y="264.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#C22A1D">04</text><text x="110" y="265.0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1B1A17" text-anchor="start">Product and collection content</text><line x1="40" y1="280.0" x2="760" y2="280.0" stroke="#D9D2C3" stroke-width="1"/><text x="40" y="308.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#C22A1D">05</text><text x="110" y="3
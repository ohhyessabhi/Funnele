<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-label="Three questions for each recommendation"><rect width="800" height="460" fill="#F6F2EA"/><text x="40" y="58" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B1A17">Three questions for each recommendation</text><rect x="40" y="76" width="56" height="4" fill="#C22A1D"/><rect x="40.0" y="200" width="228.0" height="150" rx="12" fill="#FFFFFF" stroke="#D9D2C3" stroke-width="1.5"/><text x="52.0" y="236" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1A17" text-anchor="start">Which page does it</text><text x="52.0" y="260" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1A17" text-anchor="start">affect?</text><path d="M271.0 268 L283.0 275 L271.0 282 Z" fill="#C22A1D"/><rect x="286.0" y="200" width="228.0" height="150" rx="12" fill="#FFFFFF" stroke="#D9D2C3" stroke-width="1.5"/><text x="298.0" y="236" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1A17" text-anchor="start">What will change if</text><text x="298.0" y="260" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1A17" text-anchor="start">fixed?</text><path d="M517.0 268 L529.0 275 L517.0 282 Z" fill="#C22A1D"/><rect x="532.0" y="200" width="228.0" height="150" rx="12" fill="#C22A1D" stroke="#C22A1D" stroke-width="1.5"/><text x="544.0" y="236" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">How will we know it</text><text x="544.0" y="260" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">worked?</text></svg>
